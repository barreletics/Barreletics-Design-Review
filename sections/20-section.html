/* ============================================================
   Barreletics Design Audit — Stylesheet
   Pulls tokens directly from /config/settings_data.json
   ============================================================ */

:root {
  /* Brand color tokens — calibrated to the LIVE site, not the unused settings.
     The header & footer render --colorNav from --colorBody (#fff) per
     snippets/css-variables.liquid, so the cream + plum in settings_data.json
     is dead code. The real palette is: white, ink, light-grey, coral accent. */
  --br-bg:           #ffffff;
  --br-alt-bg:       #f9f9f9;
  --br-alt-bg-2:     #f3f3f3;   /* the slightly deeper grey used in br-media-text-split */
  --br-text:         #050505;
  --br-text-soft:    #4a4a4a;
  --br-text-mute:    #8a8a8a;
  --br-line:         #e6e6e6;
  --br-line-soft:    #efefef;

  /* WARM ACCENT — restrained to cart badge ONLY (matches live site).
     Stars use gold. Sale uses ink. CTAs are black-on-white.
     The earlier f93820 was too aggressive — live site uses coral on cart only. */
  --br-accent:       #f97250;   /* cart badge ONLY — restraint is the point */
  --br-accent-hover: #e85e3c;
  --br-coral:        var(--br-accent);   /* alias */
  --br-sale:         var(--br-text);     /* sale price is just ink-bold, not red */
  --br-star:         #fbc02d;             /* gold star color */
  --br-info:         #3a8de8;             /* sale banner blue + LE chip */
  --br-le:           #3a8de8;
  --br-le-bg:        #eaf3fc;

  --br-button:       #050505;
  --br-button-text:  #ffffff;

  /* Audit accents (only used in audit chrome, NOT in mock components) */
  --au-bg:           #fafaf7;
  --au-card:         #ffffff;
  --au-flag:         #c43d2a;
  --au-flag-bg:      #fdf0ec;
  --au-ok:           #1f6f4a;
  --au-ok-bg:        #ecf6f0;
  --au-note:         #6b5b3a;
  --au-note-bg:      #fbf5e6;

  /* Typography system — PROPOSED (one family, one ramp) */
  --t-font: 'Roboto', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;

  --t-eyebrow:      12px;   /* uppercase, 0.08em, 600 */
  --t-body-sm:      14px;
  --t-body:         16px;
  --t-body-lg:      18px;
  --t-h6:           18px;
  --t-h5:           22px;
  --t-h4:           28px;
  --t-h3:           36px;
  --t-h2:           44px;
  --t-h1:           56px;
  --t-display:      72px;

  /* Mobile clamps applied via clamp() on hero/display only */
  --t-h1-mobile:    36px;
  --t-display-mobile: 44px;

  /* Spacing scale */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 24px;
  --sp-6: 32px;
  --sp-7: 48px;
  --sp-8: 64px;
  --sp-9: 96px;
  --sp-10: 128px;

  /* Buttons — ONE primary, ONE secondary, ONE tertiary, no more */
  --btn-text-size:   14px;
  --btn-pad-y:       14px;
  --btn-pad-x:       28px;
  --btn-radius:      0px;       /* matches "button_style":"square" */
  --btn-letter:      0.06em;
  --btn-weight:      600;
}

/* ============================================================ */

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  font-family: var(--t-font);
  font-size: var(--t-body);
  line-height: 1.55;
  color: var(--br-text);
  background: var(--au-bg);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-wrap: pretty;
}

img, video { max-width: 100%; display: block; }

/* ---------- Audit chrome ---------- */

.au-nav {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(250, 250, 247, 0.92);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--br-line);
}

.au-nav__inner {
  max-width: 1320px;
  margin: 0 auto;
  padding: 14px 28px;
  display: flex;
  align-items: center;
  gap: 32px;
}

.au-nav__brand {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--br-accent);
  white-space: nowrap;
}

.au-nav__brand span {
  font-weight: 400;
  letter-spacing: 0.1em;
  color: var(--br-text-soft);
  margin-left: 10px;
}

.au-nav__links {
  display: flex;
  gap: 24px;
  flex-wrap: wrap;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
}

.au-nav__links a {
  color: var(--br-text-soft);
  text-decoration: none;
  border-bottom: 1px solid transparent;
  padding-bottom: 2px;
  transition: color 0.15s, border-color 0.15s;
}

.au-nav__links a:hover { color: var(--br-text); border-color: var(--br-text); }

.au-nav__meta {
  margin-left: auto;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--br-text-mute);
  white-space: nowrap;
}

/* ---------- Document wrapper ---------- */

.au-doc {
  max-width: 1320px;
  margin: 0 auto;
  padding: 64px 28px 160px;
}

.au-section {
  padding-top: 80px;
  margin-top: -1px;
}

.au-section + .au-section {
  border-top: 1px solid var(--br-line);
  padding-top: 80px;
  margin-top: 80px;
}

.au-kicker {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  color: var(--br-accent);
  margin: 0 0 14px;
}

.au-h1 {
  font-size: clamp(40px, 5vw, 64px);
  font-weight: 400;
  line-height: 1.05;
  letter-spacing: -0.02em;
  margin: 0 0 24px;
  max-width: 18ch;
}

.au-h2 {
  font-size: clamp(28px, 3vw, 40px);
  font-weight: 500;
  line-height: 1.15;
  letter-spacing: -0.01em;
  margin: 0 0 16px;
  max-width: 22ch;
}

.au-h3 {
  font-size: 22px;
  font-weight: 600;
  line-height: 1.25;
  margin: 0 0 12px;
}

.au-lede {
  font-size: 19px;
  line-height: 1.55;
  color: var(--br-text-soft);
  max-width: 62ch;
  margin: 0 0 16px;
}

.au-body {
  font-size: 16px;
  line-height: 1.6;
  color: var(--br-text-soft);
  max-width: 62ch;
}

.au-body + .au-body { margin-top: 12px; }

.au-rule {
  height: 1px;
  background: var(--br-line);
  border: 0;
  margin: 48px 0;
}

/* ---------- Cover ---------- */

.au-cover {
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  gap: 64px;
  align-items: end;
  padding: 80px 0 64px;
  border-bottom: 1px solid var(--br-line);
}

.au-cover__meta {
  display: flex;
  flex-direction: column;
  gap: 20px;
  padding-bottom: 6px;
}

.au-cover__stat {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 16px 18px;
  background: var(--au-card);
  border: 1px solid var(--br-line);
}

.au-cover__stat b {
  font-size: 32px;
  font-weight: 400;
  letter-spacing: -0.02em;
  line-height: 1;
  color: var(--br-text);
}

.au-cover__stat span {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--br-text-mute);
}

.au-cover__stat--flag b { color: var(--au-flag); }

@media (max-width: 900px) {
  .au-cover { grid-template-columns: 1fr; gap: 40px; }
}

/* ---------- Findings cards ---------- */

.au-findings {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
}

@media (max-width: 800px) {
  .au-findings { grid-template-columns: 1fr; }
}

.au-finding {
  background: var(--au-card);
  border: 1px solid var(--br-line);
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.au-finding__head {
  display: flex;
  align-items: center;
  gap: 10px;
}

.au-finding__num {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.15em;
  color: var(--br-text-mute);
  text-transform: uppercase;
}

.au-finding__tag {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  padding: 4px 8px;
  background: var(--au-flag-bg);
  color: var(--au-flag);
}

.au-finding__tag--note { background: var(--au-note-bg); color: var(--au-note); }
.au-finding__tag--ok   { background: var(--au-ok-bg);   color: var(--au-ok); }

.au-finding h3 {
  font-size: 20px;
  font-weight: 500;
  margin: 0;
  line-height: 1.3;
}

.au-finding p {
  font-size: 14px;
  line-height: 1.55;
  color: var(--br-text-soft);
  margin: 0;
}

.au-finding__evidence {
  font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11.5px;
  line-height: 1.6;
  background: #f5f4ee;
  border-left: 2px solid var(--au-flag);
  padding: 12px 14px;
  color: #2a2a2a;
  overflow-x: auto;
  white-space: pre-wrap;
}

/* ---------- Tokens table ---------- */

.au-tokens {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 12px;
}

.au-token {
  background: var(--au-card);
  border: 1px solid var(--br-line);
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-height: 130px;
}

.au-token__swatch {
  width: 100%;
  height: 56px;
  border: 1px solid rgba(0,0,0,0.06);
}

.au-token__name {
  font-size: 13px;
  font-weight: 600;
  color: var(--br-text);
}

.au-token__hex {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 11px;
  color: var(--br-text-mute);
  letter-spacing: 0.05em;
}

.au-token__usage {
  font-size: 11px;
  color: var(--br-text-soft);
  line-height: 1.4;
}

/* ---------- Type ramp ---------- */

.au-typeramp {
  background: var(--au-card);
  border: 1px solid var(--br-line);
  padding: 32px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.au-typeramp__row {
  display: grid;
  grid-template-columns: 110px 80px 1fr;
  align-items: baseline;
  gap: 24px;
  padding-bottom: 14px;
  border-bottom: 1px dashed var(--br-line);
}

.au-typeramp__row:last-child { border-bottom: 0; padding-bottom: 0; }

.au-typeramp__label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--br-text-mute);
  font-weight: 600;
}

.au-typeramp__meta {
  font-family: ui-monospace, Menlo, monospace;
  font-size: 11px;
  color: var(--br-text-mute);
}

.au-typeramp__sample { color: var(--br-text); }

/* ---------- Section catalog (the 8 sections) ---------- */

.au-catalog {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
}

@media (max-width: 1000px) { .au-catalog { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 600px)  { .au-catalog { grid-template-columns: 1fr; } }

.au-catalog__item {
  background: var(--au-card);
  border: 1px solid var(--br-line);
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-height: 220px;
}

.au-catalog__num {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.18em;
  color: var(--br-accent);
}

.au-catalog__item h4 {
  margin: 0;
  font-size: 16px;
  font-weight: 600;
  line-height: 1.25;
}

.au-catalog__item p {
  margin: 0;
  font-size: 13px;
  line-height: 1.5;
  color: var(--br-text-soft);
}

.au-catalog__diagram {
  margin-top: auto;
  height: 60px;
  background: var(--au-bg);
  border: 1px solid var(--br-line-soft);
  display: grid;
  gap: 4px;
  padding: 4px;
}

/* ---------- Section mock wrapper ---------- */

.au-mock {
  background: var(--au-card);
  border: 1px solid var(--br-line);
  margin-top: 24px;
  overflow: hidden;
}

.au-mock__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding: 18px 24px;
  border-bottom: 1px solid var(--br-line);
  background: #fbfaf6;
}

.au-mock__title {
  display: flex;
  align-items: baseline;
  gap: 12px;
}

.au-mock__title b {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.18em;
  color: var(--br-accent);
}

.au-mock__title h3 {
  font-size: 22px;
  font-weight: 500;
  margin: 0;
  letter-spacing: -0.01em;
}

.au-mock__tabs {
  display: flex;
  gap: 0;
  border: 1px solid var(--br-line);
}

.au-mock__tab {
  appearance: none;
  background: transparent;
  border: 0;
  padding: 8px 16px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--br-text-soft);
  cursor: pointer;
  border-right: 1px solid var(--br-line);
  font-family: var(--t-font);
}

.au-mock__tab:last-child { border-right: 0; }

.au-mock__tab[aria-selected="true"] {
  background: var(--br-text);
  color: #fff;
}

.au-mock__stage {
  background: var(--br-bg);
  padding: 0;
  position: relative;
}

.au-mock__panel { display: none; }
.au-mock__panel[data-active="true"] { display: block; }

.au-mock__notes {
  padding: 18px 24px;
  background: #fbfaf6;
  border-top: 1px solid var(--br-line);
  font-size: 13px;
  line-height: 1.55;
  color: var(--br-text-soft);
  display: flex;
  gap: 24px;
  flex-wrap: wrap;
}

.au-mock__notes b { color: var(--br-text); font-weight: 600; }

.au-mock__note-item {
  display: flex;
  align-items: center;
  gap: 8px;
}

.au-mock__note-item::before {
  content: "";
  width: 6px;
  height: 6px;
  background: var(--br-coral);
  border-radius: 50%;
  flex-shrink: 0;
}

/* ============================================================
   COMPONENT TOKENS (used inside section mocks — must look like
   the LIVE site after normalization)
   ============================================================ */

.br {
  font-family: var(--t-font);
  color: var(--br-text);
  background: var(--br-bg);
}

.br * { box-sizing: border-box; }

.br-eyebrow {
  font-size: var(--t-eyebrow);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--br-accent);
  margin: 0 0 12px;
  line-height: 1.3;
}

.br-display {
  font-size: clamp(var(--t-display-mobile), 5.4vw, var(--t-display));
  line-height: 1;
  font-weight: 400;
  letter-spacing: -0.02em;
  margin: 0;
}

.br-h1 {
  font-size: clamp(var(--t-h1-mobile), 4vw, var(--t-h1));
  line-height: 1.05;
  font-weight: 400;
  letter-spacing: -0.015em;
  margin: 0;
}

.br-h2 {
  font-size: clamp(28px, 2.6vw, var(--t-h2));
  line-height: 1.1;
  font-weight: 500;
  letter-spacing: -0.01em;
  margin: 0;
}

.br-h3 {
  font-size: var(--t-h3);
  line-height: 1.15;
  font-weight: 500;
  letter-spacing: -0.005em;
  margin: 0;
}

.br-h4 {
  font-size: var(--t-h4);
  line-height: 1.2;
  font-weight: 500;
  margin: 0;
}

.br-h5 {
  font-size: var(--t-h5);
  line-height: 1.3;
  font-weight: 500;
  margin: 0;
}

.br-body {
  font-size: var(--t-body);
  line-height: 1.6;
  margin: 0;
  color: var(--br-text);
}

.br-body-lg {
  font-size: var(--t-body-lg);
  line-height: 1.55;
  margin: 0;
  color: var(--br-text);
}

.br-body-sm {
  font-size: var(--t-body-sm);
  line-height: 1.5;
  margin: 0;
}

/* Buttons */
.br-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-family: var(--t-font);
  font-size: var(--btn-text-size);
  font-weight: var(--btn-weight);
  letter-spacing: var(--btn-letter);
  text-transform: uppercase;
  padding: var(--btn-pad-y) var(--btn-pad-x);
  border-radius: var(--btn-radius);
  text-decoration: none;
  border: 1px solid transparent;
  cursor: pointer;
  transition: opacity 0.15s, background-color 0.15s, color 0.15s;
  line-height: 1;
}

.br-btn:hover { opacity: 0.88; }

.br-btn--primary {
  background: var(--br-button);
  color: var(--br-button-text);
  border-color: var(--br-button);
}

.br-btn--secondary {
  background: transparent;
  color: var(--br-text);
  border-color: var(--br-text);
}

.br-btn--tertiary {
  background: transparent;
  color: var(--br-text);
  border-color: transparent;
  padding-left: 0;
  padding-right: 0;
  border-bottom: 1px solid var(--br-text);
  border-radius: 0;
}

.br-btn--invert {
  background: #ffffff;
  color: var(--br-text);
  border-color: #ffffff;
}

.br-btn--on-image {
  background: transparent;
  color: #ffffff;
  border-color: #ffffff;
}

.br-btn--lg { font-size: 15px; padding: 16px 32px; }
.br-btn--sm { font-size: 12px; padding: 10px 20px; }

/* Section helpers */
.br-section {
  padding: var(--sp-9) var(--sp-5);
}
.br-section--tight { padding: var(--sp-7) var(--sp-5); }

.br-container { max-width: 1280px; margin: 0 auto; }
.br-container--narrow { max-width: 880px; margin: 0 auto; }

.br-grid { display: grid; }
.br-flex { display: flex; }

/* Image placeholder */
.br-img {
  background:
    repeating-linear-gradient(
      135deg,
      #efece2 0 16px,
      #e8e4d6 16px 32px
    );
  display: flex;
  align-items: center;
  justify-content: center;
  color: #7a6f5b;
  font-family: ui-monospace, Menlo, monospace;
  font-size: 11px;
  letter-spacing: 0.05em;
  text-align: center;
  padding: 12px;
  text-transform: lowercase;
}

.br-img--dark {
  background:
    repeating-linear-gradient(
      135deg,
      #2c2c2c 0 16px,
      #232323 16px 32px
    );
  color: #b5b0a1;
}

.br-img--blush {
  background:
    repeating-linear-gradient(
      135deg,
      #f3e3dc 0 16px,
      #efdcd2 16px 32px
    );
  color: #9c7464;
}

.br-img--ink {
  background:
    repeating-linear-gradient(
      135deg,
      #1f1f1f 0 16px,
      #161616 16px 32px
    );
  color: #888;
}

/* Why-it-works strip (canonical) */
.br-why-strip {
  background: var(--br-alt-bg);
  display: flex;
  align-items: stretch;
  border-top: 1px solid var(--br-line);
  border-bottom: 1px solid var(--br-line);
  width: 100%;
  -webkit-font-smoothing: antialiased;
}
.br-why-strip__label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--br-text);
  white-space: nowrap;
  padding: 14px 22px;
  background: #ffffff;
  border-right: 1px solid var(--br-line);
}
.br-why-strip__pts {
  display: flex;
  flex: 1;
  justify-content: space-between;
  align-items: center;
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--br-text-soft);
  padding: 14px 22px;
  gap: 10px;
}
.br-why-strip__div {
  width: 1px;
  height: 12px;
  background: var(--br-line);
  flex-shrink: 0;
}

/* ============================================================
   Section: Header (chrome)
   ============================================================ */

.br-header {
  background: var(--br-bg);
  color: var(--br-text);
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  padding: 18px 32px;
  border-bottom: 1px solid var(--br-line);
}

.br-header__nav {
  display: flex;
  gap: 28px;
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  font-weight: 500;
}

.br-header__logo {
  font-size: 22px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  font-weight: 400;
}

.br-header__util {
  justify-self: end;
  display: flex;
  gap: 18px;
  align-items: center;
  font-size: 12px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.br-header__cart {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  position: relative;
}

.br-header__cart-dot {
  width: 8px; height: 8px;
  background: var(--br-coral);
  border-radius: 50%;
}

/* Announcement strip */
.br-announce {
  background: var(--br-text);
  color: #fff;
  text-align: center;
  font-size: 11.5px;
  text-transform: uppercase;
  letter-spacing: 0.16em;
  padding: 9px 16px;
  font-weight: 500;
}

/* ============================================================
   Footer
   ============================================================ */

.br-footer {
  background: var(--br-bg);
  color: var(--br-text);
  padding: 80px 32px 32px;
  border-top: 1px solid var(--br-line);
}

.br-footer__grid {
  max-width: 1280px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 1.4fr repeat(4, 1fr);
  gap: 48px;
  padding-bottom: 64px;
  border-bottom: 1px solid var(--br-line);
}

@media (max-width: 800px) {
  .br-footer__grid { grid-template-columns: 1fr 1fr; gap: 32px; }
}

.br-footer__col h6 {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  font-weight: 600;
  margin: 0 0 18px;
  opacity: 0.7;
}

.br-footer__col ul {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.br-footer__col a {
  color: var(--br-text);
  text-decoration: none;
  font-size: 14px;
  border-bottom: 1px solid transparent;
}

.br-footer__col a:hover { border-color: currentColor; }

.br-footer__brand .br-header__logo { color: var(--br-text); }

.br-footer__bottom {
  max-width: 1280px;
  margin: 0 auto;
  padding-top: 24px;
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  opacity: 0.7;
  flex-wrap: wrap;
  gap: 16px;
}
/* ============================================================
   PDP pixel-final stylesheet
   Inherits all tokens from audit-styles.css
   ============================================================ */

html, body { background: #ffffff; }

/* ---------- Announcement + header ---------- */

/* ============================================================
   ROTATING TICKER — single strip, messages cross-fade
   ============================================================ */
.pdp-ticker {
  background: var(--br-text);
  color: #fff;
  height: 36px;
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
}
.pdp-ticker__slide {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 0 16px;
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 0.55s ease, transform 0.55s ease;
  white-space: nowrap;
}
.pdp-ticker__slide.is-active {
  opacity: 1;
  transform: translateY(0);
}
.pdp-ticker__slide b { font-weight: 700; }
.pdp-ticker__slide a {
  color: rgba(255,255,255,0.85);
  text-decoration: none;
  border-bottom: 1px solid rgba(255,255,255,0.6);
  padding-bottom: 1px;
  margin-left: 6px;
}
.pdp-ticker__slide a:hover { color: #fff; border-color: #fff; }

@media (max-width: 600px) {
  .pdp-ticker__slide { font-size: 11px; letter-spacing: 0.08em; }
}

.pdp-announce {
  background: var(--br-text);
  color: #fff;
  text-align: center;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  padding: 11px 16px;
}

.pdp-announce--sale {
  background: var(--br-info);
  color: #fff;
  letter-spacing: 0.12em;
  font-weight: 600;
}
.pdp-announce--sale b { font-weight: 700; }

.pdp-announce--info {
  background: #fafafa;
  color: var(--br-text);
  font-weight: 500;
  font-size: 11.5px;
  border-bottom: 1px solid var(--br-line);
}
.pdp-announce--info a {
  color: var(--br-text);
  text-decoration: none;
  border-bottom: 1px solid var(--br-text);
  padding-bottom: 1px;
  margin-left: 6px;
  font-weight: 500;
}
.pdp-announce--info a:hover { opacity: 0.7; }

.pdp-header {
  position: sticky;
  top: 0;
  z-index: 30;
  background: #ffffff;
  border-bottom: 1px solid var(--br-line);
}

.pdp-header__inner {
  max-width: 1440px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  padding: 18px 32px;
  gap: 24px;
}

.pdp-header__nav {
  display: flex;
  gap: 30px;
  font-size: 14px;
  font-weight: 500;
  letter-spacing: 0.01em;
}
.pdp-header__nav a {
  color: var(--br-text);
  text-decoration: none;
  padding: 4px 0;
  border-bottom: 1px solid transparent;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.pdp-header__nav a:hover { border-color: var(--br-text); }
.pdp-header__chev {
  font-size: 12px;
  line-height: 1;
  display: inline-block;
  margin-top: -1px;
  opacity: 0.7;
}

.pdp-header__logo {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 200px;
  height: 38px;
  padding: 0 8px;
  text-decoration: none;
}
.pdp-header__logo img {
  display: block;
  height: 100%;
  width: auto;
}
.pdp-header__logo--placeholder {
  border: 1px dashed var(--br-line);
  background: rgba(0,0,0,0.015);
  padding: 0 16px;
}
.pdp-header__logo span {
  font-family: ui-monospace, Menlo, monospace;
  font-size: 10.5px;
  letter-spacing: 0.06em;
  color: var(--br-text-mute);
  text-transform: lowercase;
}

.pdp-header__util {
  display: flex;
  gap: 24px;
  justify-content: flex-end;
  align-items: center;
  font-size: 13px;
  font-weight: 500;
}
.pdp-header__util a {
  color: var(--br-text);
  text-decoration: none;
  position: relative;
}
.pdp-header__cart {
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.pdp-header__cart-dot {
  width: 24px; height: 24px;
  background: var(--br-accent);
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-weight: 700;
  color: #fff;
  letter-spacing: 0;
}
.pdp-header__cart-dot::before {
  content: "0";
}

/* ---------- Crumb ---------- */
.pdp-crumb {
  max-width: 1440px;
  margin: 0 auto;
  padding: 18px 32px 0;
  font-size: 11.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--br-text-mute);
}
.pdp-crumb a { color: inherit; text-decoration: none; }
.pdp-crumb a:hover { color: var(--br-text); }

/* ============================================================
   PDP MAIN — gallery + buy box
   ============================================================ */

.pdp-main {
  max-width: 1440px;
  margin: 0 auto;
  padding: 32px 32px 80px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 64px;
  align-items: flex-start;
}

@media (max-width: 1000px) {
  .pdp-main { grid-template-columns: 1fr; gap: 32px; }
}

/* Gallery */
.pdp-gallery {
  display: grid;
  grid-template-columns: 88px 1fr;
  gap: 12px;
  position: sticky;
  top: 88px;
}
@media (max-width: 700px) {
  .pdp-gallery { grid-template-columns: 1fr; position: static; }
  .pdp-gallery__thumbs { display: flex; flex-direction: row; }
}

.pdp-gallery__thumbs {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.pdp-gallery__thumb {
  aspect-ratio: 1/1;
  background:
    repeating-linear-gradient(135deg, #efece2 0 10px, #e8e4d6 10px 20px);
  border: 1px solid transparent;
  cursor: pointer;
  position: relative;
}
.pdp-gallery__thumb[aria-selected="true"] { border-color: var(--br-text); }
.pdp-gallery__thumb--blush {
  background:
    repeating-linear-gradient(135deg, #f3e3dc 0 10px, #efdcd2 10px 20px);
}
.pdp-gallery__thumb--dark {
  background:
    repeating-linear-gradient(135deg, #2c2c2c 0 10px, #232323 10px 20px);
}
.pdp-gallery__thumb--video::after {
  content: "▶";
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  font-size: 16px;
  color: rgba(255,255,255,0.8);
}

.pdp-gallery__hero {
  aspect-ratio: 1/1;
  background:
    repeating-linear-gradient(135deg, #efece2 0 14px, #e8e4d6 14px 28px);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: ui-monospace, Menlo, monospace;
  font-size: 12px;
  color: #8a7e63;
  position: relative;
}
.pdp-gallery__zoom {
  position: absolute;
  bottom: 12px;
  right: 12px;
  width: 36px;
  height: 36px;
  background: rgba(255,255,255,0.9);
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 16px;
  color: var(--br-text);
}

/* Buy box */
.pdp-buy {
  display: flex;
  flex-direction: column;
  gap: 22px;
  padding-top: 6px;
}

.pdp-buy__judge {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
  color: var(--br-text-soft);
}
.pdp-buy__stars {
  color: var(--br-accent);
  letter-spacing: 0.16em;
}
.pdp-buy__judge a {
  color: var(--br-text);
  text-decoration: none;
  border-bottom: 1px solid var(--br-text);
  padding-bottom: 1px;
  font-weight: 500;
}

.pdp-buy__eyebrow {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--br-text);
  margin: 0;
}

.pdp-buy__name {
  font-size: clamp(28px, 3vw, 40px);
  font-weight: 400;
  margin: 0;
  letter-spacing: -0.015em;
  line-height: 1.1;
}

/* v2 — Brand-line dominant hierarchy */
.pdp-buy__seo-label {
  font-size: 16px;
  font-weight: 500;
  letter-spacing: -0.005em;
  color: var(--br-text);
  margin: 6px 0 14px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--br-line);
  line-height: 1.3;
}

.pdp-buy__name--brand {
  font-size: clamp(34px, 3.8vw, 52px);
  font-weight: 400;
  line-height: 1;
  letter-spacing: -0.02em;
}
.pdp-buy__seo {
  font-size: 15px;
  line-height: 1.4;
  color: var(--br-text-soft);
  margin: 14px 0 0;
  max-width: 50ch;
  font-weight: 400;
}

.pdp-buy__tagline {
  font-size: clamp(17px, 1.6vw, 20px);
  font-weight: 500;
  color: var(--br-text);
  margin: 10px 0 0;
  letter-spacing: -0.005em;
  line-height: 1.3;
}

.pdp-buy__sub {
  font-size: 15px;
  line-height: 1.55;
  color: var(--br-text-soft);
  margin: 0;
  max-width: 50ch;
}

.pdp-buy__price {
  display: flex;
  align-items: baseline;
  gap: 12px;
  margin-top: 4px;
}
.pdp-buy__price-now {
  font-size: 22px;
  font-weight: 500;
}
.pdp-buy__price-meta {
  font-size: 12.5px;
  color: var(--br-text-soft);
  letter-spacing: 0.04em;
}

.pdp-buy__row { display: flex; flex-direction: column; gap: 10px; }
.pdp-buy__row-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-size: 12px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--br-text);
}
.pdp-buy__row-head a {
  color: var(--br-text);
  text-decoration: none;
  border-bottom: 1px solid var(--br-text);
  padding-bottom: 1px;
  font-weight: 500;
}

.pdp-buy__swatches {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.pdp-buy__swatch {
  width: 36px;
  height: 36px;
  border: 1px solid var(--br-line);
  border-radius: 50%;
  cursor: pointer;
  position: relative;
  transition: border-color 0.12s, transform 0.12s;
}
.pdp-buy__swatch:hover { transform: scale(1.06); }
.pdp-buy__swatch[aria-selected="true"] {
  border-color: var(--br-text);
  box-shadow: inset 0 0 0 2px #fff;
}
.pdp-buy__swatch[data-le]::after {
  content: "LE";
  position: absolute;
  top: -8px; right: -8px;
  background: var(--br-le);
  color: #fff;
  font-size: 8.5px;
  font-weight: 700;
  letter-spacing: 0.08em;
  padding: 2px 5px 1px;
  border-radius: 2px;
}

.pdp-buy__sizes {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 6px;
}
.pdp-buy__sizes--two {
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.pdp-buy__size {
  border: 1px solid var(--br-text);
  background: #fff;
  padding: 12px 4px;
  text-align: center;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.12s, color 0.12s;
}
.pdp-buy__size--wide {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 16px 12px;
}
.pdp-buy__size-letter {
  font-size: 22px;
  font-weight: 500;
  letter-spacing: 0.04em;
  line-height: 1;
}
.pdp-buy__size-meta {
  font-size: 11px;
  letter-spacing: 0.04em;
  color: var(--br-text-soft);
  text-transform: none;
}
.pdp-buy__size--wide[aria-selected="true"] .pdp-buy__size-meta {
  color: rgba(255,255,255,0.78);
}
.pdp-buy__size:hover { background: var(--br-text); color: #fff; }
.pdp-buy__size[aria-selected="true"] { background: var(--br-text); color: #fff; }
.pdp-buy__size[disabled] {
  opacity: 0.34;
  color: var(--br-text-mute);
  border-color: var(--br-line);
  text-decoration: line-through;
  cursor: not-allowed;
}
.pdp-buy__size[disabled]:hover { background: transparent; color: var(--br-text-mute); }

.pdp-buy__cta-row {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.pdp-buy__cta {
  background: var(--br-text);
  color: #fff;
  border: 0;
  padding: 18px;
  font-family: inherit;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  cursor: pointer;
  transition: opacity 0.15s;
  text-align: center;
}
.pdp-buy__cta:hover { opacity: 0.88; }

.pdp-buy__shipnote {
  display: flex;
  gap: 16px;
  font-size: 11.5px;
  letter-spacing: 0.06em;
  color: var(--br-text-soft);
  flex-wrap: wrap;
}
.pdp-buy__shipnote span::before {
  content: "✓ ";
  color: var(--br-accent);
  margin-right: 2px;
  font-weight: 700;
}

.pdp-buy__tabs {
  border-top: 1px solid var(--br-line);
  margin-top: 4px;
}
.pdp-buy__tab {
  border-bottom: 1px solid var(--br-line);
}
.pdp-buy__tab summary {
  list-style: none;
  cursor: pointer;
  padding: 16px 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.06em;
}
.pdp-buy__tab summary::-webkit-details-marker { display: none; }
.pdp-buy__tab summary::after {
  content: "+";
  font-weight: 300;
  font-size: 22px;
  color: var(--br-text-mute);
  transition: transform 0.15s;
}
.pdp-buy__tab[open] summary::after {
  content: "−";
}
.pdp-buy__tab-body {
  padding: 0 0 18px;
  font-size: 14px;
  line-height: 1.65;
  color: var(--br-text-soft);
}
.pdp-buy__tab-body p { margin: 0 0 10px; }
.pdp-buy__tab-body p:last-child { margin-bottom: 0; }

/* ============================================================
   PILLAR STRIP
   ============================================================ */

.pdp-pillars {
  background: var(--br-alt-bg);
  border-top: 1px solid var(--br-line);
  border-bottom: 1px solid var(--br-line);
}
.pdp-pillars__inner {
  max-width: 1440px;
  margin: 0 auto;
  display: flex;
  align-items: stretch;
}
.pdp-pillars__label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--br-text);
  white-space: nowrap;
  padding: 18px 28px;
  background: #fff;
  border-right: 1px solid var(--br-line);
  display: flex;
  align-items: center;
}
.pdp-pillars__pts {
  flex: 1;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 18px 32px;
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--br-text);
  gap: 20px;
}
.pdp-pillars__div {
  width: 1px;
  height: 14px;
  background: var(--br-line);
}

@media (max-width: 800px) {
  .pdp-pillars__label { display: none; }
  .pdp-pillars__pts {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    font-size: 10.5px;
    text-align: center;
  }
  .pdp-pillars__div { display: none; }
}

/* ============================================================
   SECTION HELPERS
   ============================================================ */

.pdp-section {
  max-width: 1440px;
  margin: 0 auto;
  padding: 96px 32px;
}
.pdp-section--tight { padding: 64px 32px; }
.pdp-section--alt { background: var(--br-alt-bg); max-width: none; }
.pdp-section--alt > * {
  max-width: 1440px;
  margin-left: auto;
  margin-right: auto;
}

.pdp-eyebrow {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--br-text);
  margin: 0 0 14px;
}

.pdp-h2 {
  font-size: clamp(28px, 3.2vw, 44px);
  font-weight: 500;
  letter-spacing: -0.01em;
  line-height: 1.1;
  margin: 0;
  text-wrap: balance;
}

.pdp-h3 {
  font-size: clamp(20px, 1.6vw, 24px);
  font-weight: 500;
  letter-spacing: -0.005em;
  line-height: 1.2;
  margin: 0;
}

.pdp-lede {
  font-size: 18px;
  line-height: 1.55;
  color: var(--br-text-soft);
  margin: 16px 0 0;
  max-width: 60ch;
}

/* ============================================================
   PREMIUM / VALUE BLOCK — addresses the "expensive" objection
   ============================================================ */

.pdp-value {
  background: var(--br-text);
  color: #fff;
}
.pdp-value__inner {
  max-width: 1440px;
  margin: 0 auto;
  padding: 96px 32px;
  display: grid;
  grid-template-columns: 1fr 1.1fr;
  gap: 64px;
  align-items: center;
}
@media (max-width: 900px) {
  .pdp-value__inner { grid-template-columns: 1fr; padding: 64px 24px; gap: 32px; }
}

.pdp-value__copy .pdp-eyebrow { color: rgba(255,255,255,0.7); }
.pdp-value__copy .pdp-h2 { color: #fff; }
.pdp-value__copy .pdp-lede { color: rgba(255,255,255,0.78); }

.pdp-value__compare {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1px;
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.12);
}
.pdp-value__col {
  padding: 26px 24px;
  background: var(--br-text);
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.pdp-value__col--ours { background: #1a1a1a; }
.pdp-value__tag {
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.6);
}
.pdp-value__col--ours .pdp-value__tag { color: var(--br-accent); }
.pdp-value__amount {
  font-size: clamp(28px, 3vw, 38px);
  font-weight: 400;
  letter-spacing: -0.015em;
  line-height: 1;
  color: #fff;
  margin: 4px 0 12px;
}
.pdp-value__amount-unit {
  font-size: 13px;
  font-weight: 400;
  color: rgba(255,255,255,0.55);
  letter-spacing: 0;
  margin-left: 4px;
}
.pdp-value__list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-size: 13.5px;
  color: rgba(255,255,255,0.78);
}
.pdp-value__list li {
  position: relative;
  padding-left: 16px;
}
.pdp-value__list li::before {
  content: "";
  position: absolute;
  left: 0;
  top: 8px;
  width: 8px;
  height: 1px;
  background: rgba(255,255,255,0.4);
}
.pdp-value__col--ours .pdp-value__list li::before {
  background: var(--br-accent);
}

/* ============================================================
   BENEFIT GRID — PDP variant
   ============================================================ */

.pdp-benefits {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  margin-top: 48px;
}
@media (max-width: 800px) {
  .pdp-benefits { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 520px) {
  .pdp-benefits { grid-template-columns: 1fr; }
}

.pdp-benefit {
  background: #fff;
  border-top: 2px solid var(--br-text);
  padding: 22px 22px 26px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.pdp-benefit__num {
  font-family: ui-monospace, Menlo, monospace;
  font-size: 11px;
  letter-spacing: 0.12em;
  color: var(--br-text-mute);
  margin-bottom: 8px;
}
.pdp-benefit__title {
  font-size: 17px;
  font-weight: 600;
  margin: 0;
  letter-spacing: -0.005em;
}
.pdp-benefit__sub {
  font-size: 14px;
  line-height: 1.55;
  color: var(--br-text-soft);
  margin: 0;
}

/* ============================================================
   MEDIA SPLIT (story block)
   ============================================================ */

.pdp-split {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0;
  min-height: 580px;
}
@media (max-width: 900px) {
  .pdp-split { grid-template-columns: 1fr; min-height: 0; }
}

.pdp-split__media {
  background:
    repeating-linear-gradient(135deg, #efece2 0 18px, #e8e4d6 18px 36px);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #7a6f5b;
  font-family: ui-monospace, Menlo, monospace;
  font-size: 11px;
  min-height: 100%;
  position: relative;
}
.pdp-split__media--dark {
  background:
    repeating-linear-gradient(135deg, #2c2c2c 0 18px, #232323 18px 36px);
  color: #a39a83;
}
.pdp-split__media-tag {
  position: absolute;
  bottom: 16px;
  left: 16px;
  background: rgba(0,0,0,0.5);
  color: #fff;
  padding: 5px 9px;
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  border-radius: 0;
}

.pdp-split__copy {
  padding: 80px 64px;
  background: var(--br-alt-bg);
  display: flex;
  flex-direction: column;
  justify-content: center;
}
@media (max-width: 900px) {
  .pdp-split__copy { padding: 48px 24px; }
  .pdp-split__media { aspect-ratio: 4/5; }
}
.pdp-split__copy .pdp-h2 { margin-bottom: 16px; }

.pdp-split__list {
  list-style: none;
  margin: 28px 0 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
  font-size: 15px;
}
.pdp-split__list li {
  display: flex;
  gap: 12px;
  align-items: flex-start;
}
.pdp-split__list li::before {
  content: "→";
  color: var(--br-accent);
  font-weight: 700;
  flex-shrink: 0;
}

/* ============================================================
   TESTIMONIAL
   ============================================================ */

.pdp-quote {
  text-align: center;
  max-width: 760px;
  margin: 0 auto;
}
.pdp-quote__stars {
  color: var(--br-accent);
  letter-spacing: 0.2em;
  font-size: 18px;
  margin-bottom: 22px;
}
.pdp-quote__body {
  font-size: clamp(22px, 2.4vw, 32px);
  font-weight: 400;
  line-height: 1.35;
  margin: 0 0 24px;
  text-wrap: balance;
  letter-spacing: -0.005em;
  color: var(--br-text);
}
.pdp-quote__attr {
  font-size: 11.5px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--br-text-soft);
}
.pdp-quote__attr b {
  color: var(--br-text);
  font-weight: 700;
  margin-right: 8px;
}

/* ============================================================
   VARIANT GRID — "Shop all colors & sizes"
   ============================================================ */

.pdp-variants__head {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 24px;
  margin-bottom: 32px;
  flex-wrap: wrap;
}
.pdp-variants__head-meta { display: flex; flex-direction: column; gap: 4px; }
.pdp-variants__head-link {
  font-size: 12px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--br-text);
  text-decoration: none;
  border-bottom: 1px solid var(--br-text);
  padding-bottom: 2px;
}

.pdp-variants__tabs {
  display: flex;
  gap: 0;
  margin-bottom: 28px;
}
.pdp-variant-tab {
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.04em;
  padding: 12px 22px;
  border: 1px solid var(--br-text);
  background: #fff;
  color: var(--br-text);
  cursor: pointer;
  margin: 0 -1px 0 0;
  position: relative;
  transition: background 0.12s, color 0.12s;
}
.pdp-variant-tab[aria-selected="true"] {
  background: var(--br-text);
  color: #fff;
  z-index: 2;
}
.pdp-variant-tab:hover:not([aria-selected="true"]) {
  background: var(--br-alt-bg);
}

.pdp-variants__grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 24px;
}
@media (max-width: 1000px) { .pdp-variants__grid { grid-template-columns: repeat(2, 1fr); } }

.pdp-vcard {
  background: #fff;
  display: flex;
  flex-direction: column;
  position: relative;
  cursor: pointer;
}
.pdp-vcard__media {
  aspect-ratio: 1/1;
  background:
    repeating-linear-gradient(135deg, #efece2 0 14px, #e8e4d6 14px 28px);
  margin-bottom: 14px;
  position: relative;
  overflow: hidden;
}
.pdp-vcard__media--blush {
  background: repeating-linear-gradient(135deg, #f3e3dc 0 14px, #efdcd2 14px 28px);
}
.pdp-vcard__media--stone {
  background: repeating-linear-gradient(135deg, #d4d0c4 0 14px, #c9c5b8 14px 28px);
}
.pdp-vcard__media--dark {
  background: repeating-linear-gradient(135deg, #2c2c2c 0 14px, #232323 14px 28px);
}
.pdp-vcard__le {
  position: absolute;
  top: 12px;
  left: 12px;
  background: var(--br-le);
  color: #fff;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 4px 8px 3px;
}
.pdp-vcard__quick {
  position: absolute;
  bottom: 12px;
  left: 12px;
  right: 12px;
  background: rgba(255,255,255,0.96);
  color: var(--br-text);
  padding: 10px;
  text-align: center;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  opacity: 0;
  transition: opacity 0.15s;
}
.pdp-vcard:hover .pdp-vcard__quick { opacity: 1; }

.pdp-vcard__title {
  font-size: 14px;
  font-weight: 500;
  margin: 0 0 2px;
  line-height: 1.35;
}
.pdp-vcard__meta {
  font-size: 12px;
  color: var(--br-text-soft);
  letter-spacing: 0.02em;
}
.pdp-vcard__price {
  font-size: 13px;
  font-weight: 500;
  margin-top: 2px;
}
.pdp-vcard__sale {
  color: var(--br-accent);
  font-weight: 500;
}
.pdp-vcard__sale s {
  color: var(--br-text-mute);
  text-decoration: line-through;
  font-weight: 400;
  margin-right: 4px;
}

/* ============================================================
   REVIEWS (Judge.me restyled)
   ============================================================ */

.pdp-reviews__head {
  display: flex;
  align-items: end;
  justify-content: space-between;
  margin-bottom: 32px;
  gap: 24px;
  flex-wrap: wrap;
  padding-bottom: 24px;
  border-bottom: 1px solid var(--br-line);
}
.pdp-reviews__head-bigstars {
  font-size: 32px;
  color: var(--br-accent);
  letter-spacing: 0.18em;
  line-height: 1;
}
.pdp-reviews__head-summary {
  font-size: 14px;
  color: var(--br-text-soft);
  margin-top: 4px;
}
.pdp-reviews__head-summary b { color: var(--br-text); font-weight: 600; }

.pdp-reviews__grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 0;
  border-top: 1px solid var(--br-line);
}
.pdp-review {
  padding: 24px 32px;
  border-bottom: 1px solid var(--br-line);
  border-right: 1px solid var(--br-line);
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.pdp-review:nth-child(2n) { border-right: 0; }
.pdp-review__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 11.5px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--br-text-soft);
}
.pdp-review__stars { color: var(--br-accent); letter-spacing: 0.16em; font-size: 13px; }
.pdp-review__verified {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.pdp-review__verified::before {
  content: "✓";
  color: var(--br-accent);
  font-weight: 700;
}
.pdp-review__title {
  font-size: 15px;
  font-weight: 600;
  margin: 0;
  letter-spacing: -0.005em;
}
.pdp-review__body {
  font-size: 14px;
  line-height: 1.6;
  color: var(--br-text);
  margin: 0;
}
.pdp-review__attr {
  font-size: 11.5px;
  letter-spacing: 0.06em;
  color: var(--br-text-soft);
  margin: 0;
}
.pdp-review__attr b { color: var(--br-text); font-weight: 600; }

@media (max-width: 720px) {
  .pdp-reviews__grid { grid-template-columns: 1fr; }
  .pdp-review { border-right: 0; }
}

.pdp-reviews__foot {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 24px;
  margin-top: 32px;
  flex-wrap: wrap;
}
.pdp-reviews__more {
  font-size: 12px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--br-text);
  text-decoration: none;
  border-bottom: 1px solid var(--br-text);
  padding-bottom: 2px;
  font-weight: 500;
}
.pdp-reviews__write {
  font-size: 12px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--br-text);
  text-decoration: none;
  background: var(--br-text);
  color: #fff;
  padding: 12px 20px;
  font-weight: 700;
}
.pdp-reviews__write:hover { opacity: 0.88; }

/* ============================================================
   FAQ
   ============================================================ */

.pdp-faq {
  max-width: 880px;
  margin: 0 auto;
}
.pdp-faq__list {
  margin-top: 32px;
  border-top: 1px solid var(--br-line);
}
.pdp-faq__item {
  border-bottom: 1px solid var(--br-line);
}
.pdp-faq__item summary {
  list-style: none;
  cursor: pointer;
  padding: 22px 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  font-size: 17px;
  font-weight: 500;
  letter-spacing: -0.005em;
}
.pdp-faq__item summary::-webkit-details-marker { display: none; }
.pdp-faq__item summary::after {
  content: "+";
  font-size: 24px;
  font-weight: 300;
  color: var(--br-text-mute);
  flex-shrink: 0;
}
.pdp-faq__item[open] summary::after { content: "−"; }
.pdp-faq__body {
  padding: 0 0 22px;
  font-size: 15px;
  line-height: 1.65;
  color: var(--br-text-soft);
  max-width: 64ch;
}
.pdp-faq__body p { margin: 0 0 12px; }
.pdp-faq__body p:last-child { margin-bottom: 0; }
.pdp-faq__body a {
  color: var(--br-text);
  border-bottom: 1px solid var(--br-text);
  padding-bottom: 1px;
  text-decoration: none;
}

/* ============================================================
   PRODUCT RAIL — pairs with your kit
   ============================================================ */

.pdp-rail__head {
  display: flex;
  align-items: end;
  justify-content: space-between;
  margin-bottom: 32px;
  gap: 24px;
}
.pdp-rail__list {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 24px;
}
@media (max-width: 900px) { .pdp-rail__list { grid-template-columns: 1fr 1fr; } }

.pdp-rail-card {
  background: #fff;
  display: flex;
  flex-direction: column;
}
.pdp-rail-card__media {
  aspect-ratio: 4/5;
  background:
    repeating-linear-gradient(135deg, #efece2 0 14px, #e8e4d6 14px 28px);
  margin-bottom: 14px;
}
.pdp-rail-card__media--blush { background: repeating-linear-gradient(135deg, #f3e3dc 0 14px, #efdcd2 14px 28px); }
.pdp-rail-card__media--stone { background: repeating-linear-gradient(135deg, #d4d0c4 0 14px, #c9c5b8 14px 28px); }
.pdp-rail-card__media--dark  { background: repeating-linear-gradient(135deg, #2c2c2c 0 14px, #232323 14px 28px); }
.pdp-rail-card__title {
  font-size: 14px;
  font-weight: 500;
  margin: 0 0 2px;
}
.pdp-rail-card__price {
  font-size: 13px;
  color: var(--br-text-soft);
  margin: 0;
}

/* ============================================================
   Tweaks-controlled variants
   ============================================================ */

/* Quick Add legacy hover button kept for tweaks-panel testing only;
   the production default is the text-link .pdp-vcard__addlink */
.pdp-vcard__add {
  display: none !important;
}

/* Card style — bordered variant */
[data-card-style="bordered"] .pdp-vcard {
  border: 1px solid var(--br-line);
  padding: 12px;
  background: #fff;
  transition: border-color 0.15s;
}
[data-card-style="bordered"] .pdp-vcard:hover { border-color: var(--br-text); }
[data-card-style="bordered"] .pdp-vcard__media { margin-bottom: 12px; }

/* Verified badge toggle */
[data-verified="off"] .pdp-review__verified { display: none; }

/* CTA size variants */
[data-cta-size="compact"] .pdp-buy__cta { padding: 14px; font-size: 13px; }
[data-cta-size="bold"]    .pdp-buy__cta { padding: 22px; font-size: 15px; letter-spacing: 0.14em; }

/* ============================================================ */

.pdp-footer {
  background: #fff;
  border-top: 1px solid var(--br-line);
  padding: 80px 32px 32px;
}
.pdp-footer__grid {
  max-width: 1440px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 1.4fr repeat(4, 1fr);
  gap: 48px;
  padding-bottom: 56px;
  border-bottom: 1px solid var(--br-line);
}
@media (max-width: 900px) {
  .pdp-footer__grid { grid-template-columns: 1fr 1fr; gap: 32px; }
}
.pdp-footer__brand .pdp-header__logo {
  margin-bottom: 16px;
}
.pdp-footer__brand p {
  font-size: 14px;
  line-height: 1.55;
  color: var(--br-text-soft);
  max-width: 32ch;
  margin: 0 0 20px;
}
.pdp-footer__newsletter {
  display: flex;
  gap: 0;
  border: 1px solid var(--br-text);
}
.pdp-footer__newsletter input {
  flex: 1;
  padding: 12px 14px;
  font-family: inherit;
  font-size: 13px;
  border: 0;
  background: transparent;
  color: var(--br-text);
}
.pdp-footer__newsletter input::placeholder { color: var(--br-text-mute); }
.pdp-footer__newsletter button {
  background: var(--br-text);
  color: #fff;
  border: 0;
  padding: 12px 16px;
  font-family: inherit;
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  cursor: pointer;
}

.pdp-footer__col h6 {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  margin: 0 0 18px;
  color: var(--br-text);
}
.pdp-footer__col ul {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.pdp-footer__col a {
  color: var(--br-text-soft);
  text-decoration: none;
  font-size: 14px;
}
.pdp-footer__col a:hover { color: var(--br-text); }

.pdp-footer__bottom {
  max-width: 1440px;
  margin: 0 auto;
  padding-top: 24px;
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 16px;
  font-size: 12px;
  color: var(--br-text-mute);
  letter-spacing: 0.02em;
}
/* ============================================================
   pages-extras.css — components used on Home / Collection / Article / Blog
   that aren't already in pdp-styles.css
   ============================================================ */

/* ============== MEDIA SPLIT HERO (Home + Collection short hero) ============== */

.pg-hero-split {
  display: grid;
  grid-template-columns: 1fr 1fr;
  min-height: 640px;
  background: var(--br-alt-bg);
  border-bottom: 1px solid var(--br-line);
}
.pg-hero-split--short { min-height: 380px; }
.pg-hero-split--reverse .pg-hero-split__media { order: 2; }

.pg-hero-split__media {
  background:
    repeating-linear-gradient(135deg, #efece2 0 18px, #e8e4d6 18px 36px);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #7a6f5b;
  font-family: ui-monospace, Menlo, monospace;
  font-size: 12px;
  min-height: 100%;
  position: relative;
}
.pg-hero-split__media--dark {
  background:
    repeating-linear-gradient(135deg, #2c2c2c 0 18px, #232323 18px 36px);
  color: #a39a83;
}
.pg-hero-split__media--blush {
  background:
    repeating-linear-gradient(135deg, #f3e3dc 0 18px, #efdcd2 18px 36px);
  color: #9c7464;
}
.pg-hero-split__media-tag {
  position: absolute;
  bottom: 16px;
  left: 16px;
  background: rgba(0,0,0,0.5);
  color: #fff;
  padding: 5px 10px;
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.pg-hero-split__copy {
  padding: 96px 80px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  background: #ffffff;
}
.pg-hero-split--short .pg-hero-split__copy { padding: 56px 64px; }

.pg-hero-split__eyebrow {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--br-accent);
  margin: 0 0 14px;
}
.pg-hero-split__title {
  font-size: clamp(36px, 4.4vw, 60px);
  font-weight: 400;
  letter-spacing: -0.02em;
  line-height: 1.02;
  margin: 0;
  max-width: 16ch;
  text-wrap: balance;
}
.pg-hero-split--short .pg-hero-split__title {
  font-size: clamp(28px, 3.2vw, 44px);
  max-width: 22ch;
}
.pg-hero-split__body {
  font-size: 17px;
  line-height: 1.55;
  color: var(--br-text-soft);
  margin: 18px 0 0;
  max-width: 48ch;
}
.pg-hero-split__ctas {
  display: flex;
  gap: 12px;
  margin-top: 32px;
  flex-wrap: wrap;
}
.pg-hero-split__cta {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 14px 28px;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  text-decoration: none;
  border: 1px solid var(--br-text);
  background: var(--br-text);
  color: #fff;
  cursor: pointer;
  transition: opacity 0.15s, background 0.15s, color 0.15s;
}
.pg-hero-split__cta:hover { opacity: 0.88; }
.pg-hero-split__cta--secondary {
  background: transparent;
  color: var(--br-text);
  border-color: var(--br-text);
}

@media (max-width: 900px) {
  .pg-hero-split { grid-template-columns: 1fr; min-height: 0; }
  .pg-hero-split__media { aspect-ratio: 4/5; }
  .pg-hero-split__copy { padding: 48px 24px; }
  .pg-hero-split--short .pg-hero-split__copy { padding: 32px 24px; }
}

/* ============== COLLAB HERO (Home + Collection feature) ============== */

.pg-collab {
  position: relative;
  background:
    repeating-linear-gradient(135deg, #2c2c2c 0 20px, #232323 20px 40px);
  min-height: 560px;
  display: flex;
  align-items: flex-end;
  overflow: hidden;
}
.pg-collab__overlay {
  position: relative;
  z-index: 2;
  padding: 80px 64px;
  width: 100%;
  background:
    linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.55) 100%);
  color: #fff;
}
.pg-collab__overlay-inner { max-width: 1440px; margin: 0 auto; }
.pg-collab__le {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(255, 255, 255, 0.14);
  color: #cfe1ff;
  padding: 8px 14px 7px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  border-radius: 999px;
  margin-bottom: 18px;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
.pg-collab__le::before {
  content: "";
  display: inline-block;
  width: 6px;
  height: 6px;
  background: var(--br-le);
  border-radius: 50%;
}
.pg-collab__title {
  font-size: clamp(40px, 5vw, 72px);
  font-weight: 400;
  letter-spacing: -0.02em;
  line-height: 0.98;
  margin: 0;
  text-wrap: balance;
  max-width: 18ch;
}
.pg-collab__sub {
  font-size: clamp(16px, 1.6vw, 19px);
  line-height: 1.5;
  margin: 18px 0 0;
  opacity: 0.92;
  max-width: 56ch;
}
.pg-collab__ctas {
  display: flex;
  gap: 12px;
  margin-top: 32px;
  flex-wrap: wrap;
}
.pg-collab__cta {
  display: inline-block;
  background: #ffffff;
  color: var(--br-text);
  padding: 14px 28px;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  text-decoration: none;
}
.pg-collab__cta--ghost {
  background: transparent;
  color: #fff;
  border: 1px solid rgba(255,255,255,0.6);
}

@media (max-width: 700px) {
  .pg-collab__overlay { padding: 48px 24px; }
}

/* ============================================================
   HERO VIDEO MOMENT · short film between hero and content
   ============================================================ */
.pg-video-moment {
  position: relative;
  aspect-ratio: 21/9;
  min-height: 380px;
  max-height: 640px;
  overflow: hidden;
  background: #050505;
}
.pg-video-moment__media {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.pg-video-moment__overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 48px 32px;
  background: linear-gradient(180deg, rgba(0,0,0,0) 30%, rgba(0,0,0,0.45) 100%);
  color: #fff;
}
.pg-video-moment__eyebrow {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  margin: 0 0 14px;
  opacity: 0.88;
}
.pg-video-moment__title {
  font-size: clamp(32px, 4vw, 56px);
  font-weight: 400;
  letter-spacing: -0.015em;
  line-height: 1.05;
  margin: 0;
  max-width: 22ch;
  text-wrap: balance;
}

/* ============================================================
   COPERNI v2 · runway-first collab layout
   ============================================================ */
.pg-collab-v2 {
  background: #050505;
  color: #fff;
}
.pg-collab-v2__hero {
  position: relative;
  aspect-ratio: 16/8;
  min-height: 520px;
  overflow: hidden;
  display: flex;
  align-items: flex-end;
}
.pg-collab-v2__video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.pg-collab-v2__overlay {
  position: relative;
  z-index: 2;
  width: 100%;
  padding: 64px;
  background: linear-gradient(180deg, rgba(0,0,0,0) 30%, rgba(0,0,0,0.6) 100%);
  max-width: 1600px;
  margin: 0 auto;
}
.pg-collab-v2__title {
  font-size: clamp(36px, 5vw, 72px);

/* MEDIA SPLIT 50/50 */
/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   CANONICAL 50/50 SPLIT SIZE — DO NOT CHANGE
   Approved: v18 "Never slip in chair pose" section
   height: 420px FIXED | overflow: hidden | padding: 56px 64px
   Fixed height = all splits locked at same size regardless of content
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */

/* ============================================================

   Applied on top of v10 base. Toggle via Tweaks panel.
   ============================================================ */
[data-matured="on"] {
  --br-bg: #f1ede4;
  --br-alt-bg: #faf8f3;
  --br-alt-bg-2: #f0ece3;
  --br-text: #1c1916;

  --br-text-mute: #9a9182;
  --br-line: #e2dccf;
  --br-line-soft: #ede8dd;
  --br-accent: #c45c3f;
  --br-accent-hover: #a84d35;
  --br-coral: #c45c3f;
  --br-button: #1c1916;
  --br-button-text: #ffffff;
  --au-bg: #eae5da;
}

  background: #24201b;
}

  border-bottom-color: #e2dccf;
}
[data-matured="on"] .pdp-footer {
  background: #24201b;
}
[data-matured="on"] .v11-guarantee {
  background: #24201b;
}
[data-matured="on"] .sm {
  background: #24201b;
}
[data-matured="on"] .v11-newsletter {
  background: #24201b;
}
[data-matured="on"] .m-manifesto {
  background: #24201b;
}
[data-matured="on"] .v11-disciplines {
  background: #24201b;

/* Ground toggle */
[data-ground="white"][data-matured="on"] {
  --br-bg: #ffffff;
  --br-alt-bg: #ffffff;
  --br-alt-bg-2: #f9f9f9;
  --au-bg: #ffffff;
}
[data-ground="white"][data-matured="on"] .pdp-header {
  background: rgba(255,255,255,0.96);
}

/* Eyebrow toggle — soft */
[data-eyebrow="soft"][data-matured="on"] .v11-eyebrow,
[data-eyebrow="soft"][data-matured="on"] .pdp-eyebrow,
[data-eyebrow="soft"][data-matured="on"] .sm__eyebrow,
[data-eyebrow="soft"][data-matured="on"] .v11-rev2__eyebrow {
