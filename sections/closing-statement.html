<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barreletics — Closing Statement</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    :root { --font: 'Roboto', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
      --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; --m-dark: #24201b; --m-accent: #c45c3f; }
    html, body { margin: 0; padding: 0; font-family: var(--font); background: var(--m-dark);
      color: #fff; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    .mat { background: var(--m-dark); color: #fff; font-family: var(--font); }
    .m-eyebrow { font-size: 12px; font-weight: 500; letter-spacing: 0.02em; text-transform: none;
      color: rgba(255,255,255,0.7); margin: 0 0 18px; display: inline-flex; align-items: center;
      justify-content: center; gap: 10px; }
    .m-eyebrow::before { content: ""; width: 22px; height: 1px; background: rgba(255,255,255,0.5); }
    .m-display { font-size: clamp(34px, 4.4vw, 62px); font-weight: 300; letter-spacing: -0.03em;
      line-height: 1.0; margin: 0; color: #fff; }
    .m-display strong { font-weight: 600; }
    .m-close { background: var(--m-dark); color: #fff; padding: 88px 56px; text-align: center; }
    .m-close__line { font-size: clamp(34px, 4.4vw, 60px); font-weight: 300; letter-spacing: -0.03em;
      line-height: 1.04; margin: 0 auto; max-width: 18ch; color: #fff; }
    .m-close__line strong { font-weight: 600; }
    .m-close__sub { font-size: 16px; line-height: 1.55; color: rgba(255,255,255,0.72); margin: 24px auto 0;
      max-width: 40ch; }
    .m-close__cta { display: inline-flex; align-items: center; gap: 10px; margin-top: 38px; padding: 17px 38px;
      background: #fff; color: var(--m-dark); font-size: 12px; font-weight: 600; letter-spacing: 0.08em;
      text-transform: uppercase; text-decoration: none; transition: opacity 0.15s; }
    .m-close__cta:hover { opacity: 0.9; }
    .m-close__offer { margin: 26px 0 0; font-size: 12.5px; letter-spacing: 0.04em; color: rgba(255,255,255,0.6); }
    .m-close__offer b { color: #fff; font-weight: 600; }
    @media (max-width: 900px) {
      .m-close { padding: 60px 24px; }
    }
  </style>
</head>
<body>
  <div class="mat">
    <div class="m-close">
      <p class="m-eyebrow">The final word</p>
      <h3 class="m-display">Secure in <strong>every hold.</strong></h3>
      <p class="m-close__sub">One pair, a thousand classes. Same grip from your first class to your hundredth.</p>
      <a class="m-close__cta">Shop now</a>
      <p class="m-close__offer"><b>Free shipping</b> on all orders. 30-day guarantee.</p>
    </div>
  </div>
</body>
</html>
