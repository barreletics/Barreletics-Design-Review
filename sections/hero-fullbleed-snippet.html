<style>
  /* REUSABLE — centered full-bleed hero (BZ-025). Copy section + CSS to any page */
  .hero-fullbleed {
    position: relative;
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    min-height: max(90vh, 560px);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: #1c1916;
    color: #fff;
    font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  .hero-fullbleed__media { position: absolute; inset: 0; z-index: 0; }
  .hero-fullbleed__media img,
  .hero-fullbleed__media video {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  /* Centered readability — even wash + bottom fade (not left-weighted) */
  .hero-fullbleed__media::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(28,25,22,0.35) 0%, rgba(28,25,22,0.55) 45%, rgba(28,25,22,0.72) 100%);
    pointer-events: none;
  }
  .hero-fullbleed__overlay {
    position: relative; z-index: 1; text-align: center;
    padding: 96px 40px 80px; max-width: 720px; width: 100%;
  }
  .hero-fullbleed__brand {
    font-size: 11px; font-weight: 700; letter-spacing: 0.16em;
    text-transform: uppercase; color: rgba(255,255,255,0.92); margin: 0 0 18px;
  }
  .hero-fullbleed__trust {
    display: flex; align-items: center; justify-content: center;
    gap: 10px; flex-wrap: wrap; margin: 0 0 22px;
    font-size: 13px; font-weight: 400; color: rgba(255,255,255,0.92);
  }
  .hero-fullbleed__trust a { color: inherit; text-decoration: none; }
  .hero-fullbleed__trust a:hover { color: #fff; text-decoration: underline; }
  .hero-fullbleed__stars {
    color: #c45c3f; letter-spacing: 0.1em; font-size: 14px; line-height: 1; flex-shrink: 0;
  }
  /* Soft white/muted on dark — not rust */
  .hero-fullbleed__eyebrow {
    font-size: 11px; font-weight: 700; letter-spacing: 0.12em;
    text-transform: uppercase; color: rgba(255,255,255,0.72); margin: 0 0 14px;
  }
  /* BZ-020 · Home size · Title Case (BZ-024) */
  .hero-fullbleed__title {
    font-size: clamp(40px, 6vw, 64px); font-weight: 400; letter-spacing: -0.03em; line-height: 1.08;
    line-height: 1.12; color: #fff; margin: 0 0 18px;
    text-shadow: 0 2px 28px rgba(0,0,0,0.28);
  }
  .hero-fullbleed__lede {
    font-size: clamp(15px, 1.6vw, 18px); font-weight: 400; line-height: 1.55;
    color: rgba(255,255,255,0.9); max-width: 42ch; margin: 0 auto 28px;
  }
  .hero-fullbleed__cta-group {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 12px;
  }
  .hero-fullbleed__cta {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 52px; padding: 16px 36px; background: #fff; color: #1c1916;
    font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
    text-decoration: none; border-radius: 4px; border: 1px solid #fff;
  }
  .hero-fullbleed__cta:hover { background: transparent; color: #fff; text-decoration: none; }
  .hero-fullbleed__cta--ghost { background: transparent; color: #fff; }
  .hero-fullbleed__cta--ghost:hover { background: #fff; color: #1c1916; }
  @media (max-width: 768px) {
    .hero-fullbleed { min-height: 90vh; min-height: 90dvh; }
    .hero-fullbleed__overlay { padding: 72px 20px 56px; }
    .hero-fullbleed__title { font-size: clamp(34px, 9vw, 44px); }
    .hero-fullbleed__cta-group { width: 100%; }
    .hero-fullbleed__cta { width: 100%; max-width: 280px; }
  }
</style>

<section class="hero-fullbleed" aria-label="Page hero" data-media-type="image" data-align="center">
  <div class="hero-fullbleed__media">
    <img src="https://barreletics.com/cdn/shop/files/IMG_2917.jpg?v=1741040637&width=2000" alt="" width="2000" height="1333" fetchpriority="high" decoding="async">
  </div>
  <div class="hero-fullbleed__overlay">
    <p class="hero-fullbleed__brand">Barreletics</p>
    <!-- optional: <p class="hero-fullbleed__eyebrow">Eyebrow line</p> -->
    <h1 class="hero-fullbleed__title">Headline In Title Case</h1>
    <p class="hero-fullbleed__lede">One short supporting sentence in sentence case.</p>
    <div class="hero-fullbleed__cta-group">
      <a href="#main" class="hero-fullbleed__cta">Primary Cta</a>
      <!-- optional: <a href="…" class="hero-fullbleed__cta hero-fullbleed__cta--ghost">Secondary</a> -->
    </div>
  </div>
</section>
