name: AI Review PR Workflow

on:
  workflow_dispatch:
    inputs:
      commit_message:
        description: 'Commit message for changes'
        required: true
        default: 'Update via AI assistant'
      branch_name:
        description: 'Optional custom branch name (auto-generated if empty)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for uncommitted changes
        id: check_changes
        run: |
          if git diff-index --quiet HEAD --; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No uncommitted changes detected"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Uncommitted changes detected"
            git diff --stat
          fi

      - name: Generate branch name
        id: branch
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          if [ -z "${{ github.event.inputs.branch_name }}" ]; then
            BRANCH="ai-review-$(date +%s)"
          else
            BRANCH="${{ github.event.inputs.branch_name }}"
          fi
          echo "branch_name=$BRANCH" >> $GITHUB_OUTPUT
          echo "Branch name: $BRANCH"

      - name: Configure Git
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions"

      - name: Create and checkout ai-review branch
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git checkout -b ${{ steps.branch.outputs.branch_name }}
          echo "Created and checked out branch: ${{ steps.branch.outputs.branch_name }}"

      - name: Stage all changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git add -A
          echo "Staged all changes:"
          git diff --cached --stat

      - name: Commit changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git commit -m "${{ github.event.inputs.commit_message }}"
          echo "Commit created successfully"
          git log -1 --oneline

      - name: Push branch to GitHub
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git push origin ${{ steps.branch.outputs.branch_name }}
          echo "Branch pushed: ${{ steps.branch.outputs.branch_name }}"

      - name: Create or update Pull Request
        if: steps.check_changes.outputs.has_changes == 'true'
        id: create_pr
        uses: actions/github-script@v7
        with:
          script: |
            const branch = '${{ steps.branch.outputs.branch_name }}';
            const title = 'AI Review: ${{ github.event.inputs.commit_message }}';
            const body = `## AI-Assisted Changes

**Branch:** \`${branch}\`
**Automated By:** GitHub Actions
**Status:** ✅ Ready for AI Review

### Changes
This PR contains changes prepared by the AI assistant. Please review the files and approve if changes are acceptable.

### Next Steps
1. Review changes in the "Files changed" tab
2. If acceptable: Approve the PR
3. Merge to main (manual click)

---
*This PR was automatically created. No manual git operations needed.*`;

            // Check if PR already exists for this branch
            try {
              const prs = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head: `${context.repo.owner}:${branch}`,
                state: 'open'
              });

              if (prs.data.length > 0) {
                // Update existing PR
                const pr = prs.data[0];
                console.log(`Updating existing PR #${pr.number}`);

                await github.rest.pulls.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                  title: title,
                  body: body
                });

                core.setOutput('pr_number', pr.number);
                core.setOutput('pr_url', pr.html_url);
                core.setOutput('pr_created', false);
              } else {
                // Create new PR
                const pr = await github.rest.pulls.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: title,
                  head: branch,
                  base: 'main',
                  body: body,
                  draft: false
                });

                console.log(`Created PR #${pr.data.number}`);
                core.setOutput('pr_number', pr.data.number);
                core.setOutput('pr_url', pr.data.html_url);
                core.setOutput('pr_created', true);
              }
            } catch (error) {
              console.error('Error managing PR:', error);
              throw error;
            }

      - name: Comment with ChatGPT Review Request
        if: steps.check_changes.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = '${{ steps.create_pr.outputs.pr_number }}';
            const prCreated = '${{ steps.create_pr.outputs.pr_created }}';

            const reviewRequestBody = `## 🤖 AI Review Required

@ChatGPT (or reviewer): Please review the changes in this PR.

**What to check:**
- [ ] Code quality and style consistency
- [ ] No syntax errors
- [ ] Documentation is updated if needed
- [ ] Changes align with project goals
- [ ] No breaking changes to existing functionality

**After Review:**
- Comment your approval or request changes
- Author will merge manually once approved

---
*Automated review request - ready for human oversight*`;

            if (prNumber) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: reviewRequestBody
              });
              console.log(`Review request comment posted to PR #${prNumber}`);
            }

      - name: Output PR Summary
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          echo "=== PR CREATED SUCCESSFULLY ==="
          echo "PR Number: ${{ steps.create_pr.outputs.pr_number }}"
          echo "PR URL: ${{ steps.create_pr.outputs.pr_url }}"
          echo "Branch: ${{ steps.branch.outputs.branch_name }}"
          echo "Status: Ready for AI review"
          echo ""
          echo "Next: Review the PR at the URL above, then merge manually."

      - name: No changes detected
        if: steps.check_changes.outputs.has_changes == 'false'
        run: |
          echo "No uncommitted changes to process."
          echo "If you have changes, stage them and run the workflow again."
