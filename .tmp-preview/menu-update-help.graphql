mutation {
  menuUpdate(
    id: "gid://shopify/Menu/313280364835"
    title: "Help menu"
    items: [
      { title: "FAQ", type: HTTP, url: "/pages/faq" }
      { title: "Contact Us", type: HTTP, url: "/pages/contact-us-form" }
      { title: "Returns & Exchanges", type: HTTP, url: "/pages/returns" }
    ]
  ) {
    menu { handle items { title url } }
    userErrors { field message }
  }
}
