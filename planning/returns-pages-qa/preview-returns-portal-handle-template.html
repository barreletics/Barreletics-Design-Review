<section

>
  <div class="section__inner "><header class="page-content__head"><p class="eyebrow eyebrow--accent">Returns & Exchanges</p><h1 class="page-content__title">Start a Return or Exchange</h1><p class="page-content__subtitle"></p></header><div class="page-content__body">

<style>
  .page-content__head {
    text-align: center;
    margin: 0 0 var(--space-8);
  }

  .page-content__title {
    font-size: var(--type-hero-size);
    font-weight: var(--type-hero-weight);
    line-height: var(--type-hero-leading);
    letter-spacing: var(--type-hero-tracking);
    text-transform: none;
    color: var(--text-primary);
    margin: 0;
  }

  .page-content__subtitle {
    font-size: var(--text-md);
    color: var(--text-body);
    line-height: var(--leading-relaxed);
    margin: var(--space-3) 0 0;
  }

  .page-content__body {
    font-size: var(--text-md);
    color: var(--text-body);
    line-height: var(--leading-loose);
  }

  /* Page bodies are hand-authored in Admin and arrive with their own markup and, on the
     legacy pages, their own inline styles. Style only what the editor emits bare — do not
     reach into nested elements, or a pasted layout gets overridden. */
  .page-content__body > p,
  .page-content__body > ul,
  .page-content__body > ol,
  .page-content__body > table {
    margin: 0 0 var(--space-4);
  }

  .page-content__body > h2 {
    font-size: var(--text-2xl);
    font-weight: var(--weight-bold);
    color: var(--text-primary);
    letter-spacing: var(--tracking-tight);
    margin: var(--space-8) 0 var(--space-4);
  }

  .page-content__body > h3 {
    font-size: var(--text-lg);
    font-weight: var(--weight-bold);
    color: var(--text-primary);
    margin: var(--space-6) 0 var(--space-3);
  }

  .page-content__body a {
    color: var(--text-primary);
    text-decoration: underline;
    text-underline-offset: 2px;
  }

  .page-content__body a:hover {
    color: var(--color-rust);
  }

  /* Admin-authored bodies are inline text links ~16-18px tall. Grow the hit region to 44px
     with a transparent overlay so nothing moves visually and pasted inline styles survive. */
  .page-content__body a {
    position: relative;
  }

  .page-content__body a::after {
    content: '';
    position: absolute;
    inset: -14px -10px;
  }

  .page-content__body img {
    max-width: 100%;
    height: auto;
  }

  .page-content__body > *:last-child {
    margin-bottom: 0;
  }

  @media (max-width: 768px) {
    .page-content__title {
      font-size: var(--text-3xl);
    }
  }
</style>



</body></html>
