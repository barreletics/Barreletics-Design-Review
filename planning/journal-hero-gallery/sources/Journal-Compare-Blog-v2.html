<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Compare Blog.html vs Journal v2</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #1c1916; color: #fff; }
    header { padding: 14px 20px; }
    header h1 { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
    header p { font-size: 13px; opacity: 0.8; max-width: 80ch; line-height: 1.45; }
    header a { color: #e8c4b8; }
    .cols { display: grid; grid-template-columns: 1fr 1fr; height: calc(100vh - 100px); }
    .col { display: flex; flex-direction: column; border-left: 1px solid #333; }
    .col:first-child { border-left: none; }
    .label { padding: 10px 14px; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; background: #2a2622; }
    iframe { flex: 1; width: 100%; border: 0; background: #fff; }
  </style>
</head>
<body>
  <header>
    <h1>Old Blog.html vs Journal Definitive-v2</h1>
    <p>If you opened <b>Barreletics Blog.html</b>, you were on the legacy file. Right pane is the new Journal (Home chrome, From the studio, shop strip, FAQ). Direct: <a href="Barreletics%20Journal%20-%20Definitive-v2.html">Journal v2 only</a></p>
  </header>
  <div class="cols">
    <div class="col">
      <div class="label">Legacy — Blog.html (unchanged)</div>
      <iframe src="Barreletics%20Blog.html"></iframe>
    </div>
    <div class="col">
      <div class="label">NEW — Journal Definitive-v2</div>
      <iframe src="Barreletics%20Journal%20-%20Definitive-v2.html"></iframe>
    </div>
  </div>
</body>
</html>
