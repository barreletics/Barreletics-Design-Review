<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Title type — Closed vs Open vs Coperni</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: #f5f2ec;
      color: #1c1916;
      font-family: Roboto, sans-serif;
      min-height: 100vh;
      padding: 48px 32px 80px;
    }
    .hint {
      font-size: 12px;
      font-weight: 400;
      color: #6b645a;
      margin: 0 0 36px;
    }
    .row {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0;
      min-width: 1080px;
    }
    .col {
      padding: 8px 28px 8px 0;
      border-right: 1px solid #ddd6c8;
    }
    .col:last-child {
      border-right: none;
      padding-right: 0;
    }
    .col:not(:first-child) {
      padding-left: 28px;
    }
    .label {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.01em;
      color: #6b645a;
      margin: 0 0 20px;
    }
    .sample {
      margin: 0 0 12px;
      color: #1c1916;
    }
    .closed,
    .open,
    .new {
      font-family: Roboto, sans-serif;
      font-style: normal;
      font-weight: 500;
      font-size: clamp(38px, 4.6vw, 52px);
      line-height: 1.10;
      letter-spacing: -0.028em;
    }
    .old {
      font-family: Georgia, 'Times New Roman', serif;
      font-style: italic;
      font-weight: 400;
      font-size: clamp(28px, 3.6vw, 50px);
      line-height: 1.05;
      letter-spacing: 0;
    }
    .verdict {
      display: block;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-top: 28px;
    }
    .verdict-off { color: #c45c3f; }
    .verdict-on { color: #1c1916; }
  </style>
</head>
<body>
  <p class="hint">Same words. Four titles. Look.</p>
  <div class="row">
    <div class="col">
      <p class="label">Closed</p>
      <p class="sample closed">Barreletics × Coperni</p>
      <p class="sample closed">Never Loses Shape.</p>
    </div>
    <div class="col">
      <p class="label">Open</p>
      <p class="sample open">Barreletics × Coperni</p>
      <p class="sample open">Never Loses Shape.</p>
    </div>
    <div class="col">
      <p class="label">Old Coperni</p>
      <p class="sample old">Barreletics × Coperni</p>
      <p class="sample old">Never Loses Shape.</p>
      <span class="verdict verdict-off">Different</span>
    </div>
    <div class="col">
      <p class="label">New Coperni</p>
      <p class="sample new">Barreletics × Coperni</p>
      <p class="sample new">Never Loses Shape.</p>
      <span class="verdict verdict-on">Same as Closed</span>
    </div>
  </div>
</body>
</html>
